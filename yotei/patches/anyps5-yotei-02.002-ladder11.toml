# Ghost of Yotei PPSA26344 v02.002.000: quality ladder row 11 for AnyPS5's relinker (--patches).
# The game keeps one int, the row of its own scalability ladder (row 0 = full quality; row 15 = LOD 0.1, three fewer sun
# shadow views, small shadow casters culled; row 11 = LOD 0.2, two fewer sun shadow views). These 17 sites are every
# instruction that reads it (movsxd r64, [rip+row], 7 bytes); each becomes mov r32, 11; nop, so the game uses row 11.
# Measured on a Ryzen 5 3600 + RTX 3080 with AnyKyty yotei/best and 1080p output: 15.6 fps at row 0, 23.8 fps at row 15.
# va = ELF virtual address in the unwrapped eboot (tools/unwrap_self.py eboot.bin eboot.elf). By DarthPotato.
format = 1

[[patch]]
name     = "ladder_row11_c47c1b"
description = "movsxd rax, [rip+ladder_row] -> mov eax, 11; nop"
target   = "eboot.elf"
va       = 0xc47c1b
expected = "4863058e654504"
value    = "b80b0000006690"

